<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gigino-music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>My Full-Stack App</h1>
        <button id="fetchDataBtn">Get Backend Message</button>
        <p id="displayMessage">Waiting for data...</p>
    </div>
    <div class="container">
        <textarea id="urlInput"></textarea>
        <button id="downloadBtn">Download music video</button>
        <p id="displayMessage2">Ready to download :)</p>
    </div>

    <div class="container">
        <input type="file" id="musicFileInput" accept="audio/*">
        <button id="uploadBtn">Upload Music</button>
        <p id="displayMessage3"></p>
    </div>
    <script src="app.js"></script>
</body>

</html>
