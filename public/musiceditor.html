<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gigino-music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <textarea id="urlInput"></textarea>
        <button id="downloadBtn">Download music video</button>
        <p id="displayMessage">Ready to download :)</p>
    </div>

    <div class="container">
        <input type="file" id="musicFileInput" accept=".mp3">
        <button id="uploadBtn">Upload Music</button>
        <p id="displayMessage2"></p>
    </div>

    <div class="container">
        <input type="file" id="csvFileInput" accept=".csv">
        <button id="downloadCsvBtn">Download songs from csv</button>
        <p id="displayMessage3"></p>
    </div>
    <script src="musiceditor.js"></script>
</body>

</html>
